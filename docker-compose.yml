version: "3.8"

services:
  web:
    image: "${APP_IMAGE:-lostfound-web:latest}"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      DATABASE_URL: "postgresql+psycopg://lostfound:${POSTGRES_PASSWORD:-lostfound-change-me}@db:5432/lostfound"
      UPLOAD_STORAGE_BACKEND: "database"
      UPLOAD_CACHE_DIR: "/tmp/lostfound/upload-cache"
      LOG_TO_STDOUT: "1"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3:8b}"
      OLLAMA_TEXT_MODEL: "${OLLAMA_TEXT_MODEL:-llama3:8b}"
      OLLAMA_IMAGE_MODEL: "${OLLAMA_IMAGE_MODEL:-llava}"
      AI_CHAT_MODEL: "${AI_CHAT_MODEL:-llama3:8b}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    ports:
      - target: 8000
        published: ${PUBLISHED_PORT:-8000}
        protocol: tcp
        mode: ingress
    networks:
      - lostfound_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      mode: replicated
      replicas: ${WEB_REPLICAS:-2}
      endpoint_mode: vip
      placement:
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "lostfound"
      POSTGRES_USER: "lostfound"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lostfound-change-me}"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - lostfound_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.lostfound.db == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

networks:
  lostfound_net:
    driver: overlay
    attachable: true

volumes:
  db_data:

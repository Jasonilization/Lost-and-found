services:
  web:
    image: "${APP_IMAGE:?Set APP_IMAGE to registry/lostfound:<version> from build.sh}"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      GUNICORN_CMD_ARGS: "--timeout 180 --graceful-timeout 180 --keep-alive 5"
      DATABASE_URL: "postgresql+psycopg://lostfound:${POSTGRES_PASSWORD:-lostfound-change-me}@${POSTGRES_HOST:-db}:5432/lostfound"
      DATABASE_WAIT_TIMEOUT: "${DATABASE_WAIT_TIMEOUT:-180}"
      DATABASE_WAIT_INITIAL_DELAY: "${DATABASE_WAIT_INITIAL_DELAY:-1}"
      DATABASE_WAIT_MAX_DELAY: "${DATABASE_WAIT_MAX_DELAY:-8}"
      DATABASE_CONNECT_TIMEOUT: "${DATABASE_CONNECT_TIMEOUT:-5}"
      UPLOAD_STORAGE_BACKEND: "database"
      UPLOAD_CACHE_DIR: "/tmp/lostfound/upload-cache"
      LOG_TO_STDOUT: "1"
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      CORS_ALLOWED_METHODS: "${CORS_ALLOWED_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}"
      API_DEBUG_LOGGING: "${API_DEBUG_LOGGING:-1}"
      REQUEST_DEBUG_LOGGING: "${REQUEST_DEBUG_LOGGING:-1}"
      REQUEST_DEBUG_PAYLOAD_MAX_CHARS: "${REQUEST_DEBUG_PAYLOAD_MAX_CHARS:-4000}"
      OLLAMA_HOST: "${OLLAMA_HOST:?Set OLLAMA_HOST to an Ollama URL reachable from web containers, for example http://host.docker.internal:11434 on Docker Desktop or http://<MAC_LAN_IP>:11434 from Pis}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3:8b}"
      OLLAMA_TEXT_MODEL: "${OLLAMA_TEXT_MODEL:-llama3:8b}"
      OLLAMA_IMAGE_MODEL: "${OLLAMA_IMAGE_MODEL:-llava}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-120}"
      AI_CHAT_MODEL: "${AI_CHAT_MODEL:-llama3:8b}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    ports:
      - target: 8000
        published: ${PUBLISHED_PORT:-8000}
        protocol: tcp
        mode: ingress
    networks:
      lostfound_net:
        aliases:
          - backend
          - web
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, socket, urllib.request; host = socket.gethostbyname(socket.gethostname()); url = 'http://{}:{}/ready'.format(host, os.environ.get('PORT', '8000')); urllib.request.urlopen(url, timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${WEB_HEALTH_START_PERIOD:-150s}
    deploy:
      mode: replicated
      replicas: ${WEB_REPLICAS:-1}
      endpoint_mode: vip
      placement:
        constraints:
          - node.hostname != docker-desktop
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "lostfound"
      POSTGRES_USER: "lostfound"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lostfound-change-me}"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      lostfound_net:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.lostfound.db == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

networks:
  lostfound_net:
    driver: "${LOSTFOUND_NETWORK_DRIVER:-overlay}"
    attachable: true

volumes:
  db_data:
